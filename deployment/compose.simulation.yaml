name: brash-teleoperation-simulation
services:
  control-plane:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    network_mode: host
    command: ["npm", "run", "dev:control"]
    environment:
      BRASH_TELEOP_CONTROL_TOKEN: "${BRASH_TELEOP_CONTROL_TOKEN:?set BRASH_TELEOP_CONTROL_TOKEN}"
      BRASH_TELEOP_CONTROL_HOST: "127.0.0.1"
      BRASH_TELEOP_CONTROL_PORT: "4310"
      BRASH_TELEOP_STATE_FILE: "/var/lib/brash-teleoperation/control-plane-state.json"
      BRASH_TELEOP_ALLOW_UNCOORDINATED_SIMULATION: "true"
      BRASH_TELEOP_OPERATOR_ID: "${BRASH_TELEOP_OPERATOR_ID:-operator-001}"
      BRASH_TELEOP_ROBOT_ID: "b2-unit-001"
      BRASH_TELEOP_ROBOT_CONTROL_TOKEN: "${BRASH_TELEOP_ROBOT_CONTROL_TOKEN:?set BRASH_TELEOP_ROBOT_CONTROL_TOKEN}"
      BRASH_TELEOP_OPERATOR_CONNECT_ORIGINS: "http://127.0.0.1:4312"
    volumes:
      - control-state:/var/lib/brash-teleoperation
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4310/health"]
      interval: 10s
      timeout: 2s
      retries: 3

  robot-edge-simulator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    network_mode: host
    command: ["npm", "run", "dev:edge"]
    environment:
      BRASH_TELEOP_EDGE_TOKEN: "${BRASH_TELEOP_EDGE_TOKEN:?set BRASH_TELEOP_EDGE_TOKEN}"
      BRASH_TELEOP_EDGE_HOST: "127.0.0.1"
      BRASH_TELEOP_EDGE_PORT: "4311"
      BRASH_TELEOP_ROBOT_ID: "b2-unit-001"
      BRASH_TELEOP_ROBOT_PROFILE: "/app/config/robot-profiles/b2-z1.simulation.json"
      BRASH_TELEOP_CONTROL_URL: "http://127.0.0.1:4310/"
      BRASH_TELEOP_ROBOT_CONTROL_TOKEN: "${BRASH_TELEOP_ROBOT_CONTROL_TOKEN:?set BRASH_TELEOP_ROBOT_CONTROL_TOKEN}"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4311/health"]
      interval: 10s
      timeout: 2s
      retries: 3

  immutable-media-simulator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    network_mode: host
    command: ["npm", "run", "dev:media"]
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      BRASH_TELEOP_CONTROL_TOKEN: "${BRASH_TELEOP_CONTROL_TOKEN:?set BRASH_TELEOP_CONTROL_TOKEN}"
      BRASH_TELEOP_ROBOT_CONTROL_TOKEN: "${BRASH_TELEOP_ROBOT_CONTROL_TOKEN:?set BRASH_TELEOP_ROBOT_CONTROL_TOKEN}"
      BRASH_TELEOP_MEDIA_SIGNING_SECRET: "${BRASH_TELEOP_MEDIA_SIGNING_SECRET:?set BRASH_TELEOP_MEDIA_SIGNING_SECRET}"
      BRASH_TELEOP_OPERATOR_ID: "${BRASH_TELEOP_OPERATOR_ID:-operator-001}"
      BRASH_TELEOP_ROBOT_ID: "b2-unit-001"
      BRASH_TELEOP_CONTROL_URL: "http://127.0.0.1:4310/"
      BRASH_TELEOP_OPERATOR_ORIGIN: "http://127.0.0.1:4310"
      BRASH_TELEOP_MEDIA_HOST: "127.0.0.1"
      BRASH_TELEOP_MEDIA_PORT: "4312"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4312/health"]
      interval: 10s
      timeout: 2s
      retries: 3

volumes:
  control-state: {}
